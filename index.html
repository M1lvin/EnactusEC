<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-centered.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('enactus-theme')
          if (['light', 'dark', 'system'].includes(saved)) preference = saved
        } catch { /* Системная тема доступна без хранилища. */ }
        const systemTheme = matchMedia('(prefers-color-scheme: dark)')
        function applyTheme() {
          document.documentElement.dataset.themePreference = preference
          document.documentElement.dataset.theme = preference === 'system'
            ? (systemTheme.matches ? 'dark' : 'light')
            : preference
        }
        applyTheme()
        systemTheme.addEventListener('change', applyTheme)
      })()
    </script>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <meta name="description" content="Enactus EC — команда Enactus Инженерного колледжа Light Academy, Бишкек. Наши проекты, команда и возможности участия." />
    <title>Enactus EC — идеи превращаются в действия</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
